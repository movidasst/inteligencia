name: Validate Inteligencia SST

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check app-v2.js
          node --check app-v3.js
          node --check app-v4.js
          node --check analytics-v2.js
          node --check inteligencia-v2.js
          node --check inteligencia-v2.0.1.js
      - name: Run analytics smoke test
        run: node tests/analytics-smoke.js
      - name: Run parser V2 smoke test
        run: node tests/parser-v2-smoke.js
      - name: Check required files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s inteligencia-v2.html
          test -s inteligencia-v2.css
          test -s analytics-v2.js
          test -s inteligencia-v2.0.1.js
