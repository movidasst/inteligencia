name: Validate Inteligencia SST

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check app-v2.js
          node --check app-v3.js
      - name: Check required files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
